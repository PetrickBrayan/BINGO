<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1b2d">
  <title>Bingo</title>
  <link rel="stylesheet" href="css/sorteio.css">
</head>
<body>
  <main class="tela">
    <section class="coluna-da-bola" aria-live="polite">
      <div class="bola" id="bola"></div>
      <ol class="anteriores" id="anteriores" aria-label="Últimos números sorteados"></ol>
      <p class="contador" id="contador"></p>
    </section>
    <section class="painel" id="painel" aria-label="Painel com os números sorteados"></section>
  </main>

  <footer class="rodape">
    <nav class="comandos" id="comandos" aria-label="Comandos do sorteio">
      <button type="button" class="principal" data-acao="sortear">Sortear <kbd>Espaço</kbd></button>
      <button type="button" data-acao="repetir">Repetir voz <kbd>R</kbd></button>
      <button type="button" data-acao="desfazer">Desfazer <kbd>⌫</kbd></button>
      <button type="button" data-acao="conferir">Conferir cartela <kbd>C</kbd></button>
      <a href="cartelas.html" target="_blank" rel="noopener">Cartelas</a>
      <button type="button" data-acao="voz">Voz <kbd>M</kbd></button>
      <button type="button" data-acao="menos">Números − <kbd>-</kbd></button>
      <button type="button" data-acao="mais">Números + <kbd>+</kbd></button>
      <button type="button" data-acao="tema">Tema <kbd>T</kbd></button>
      <button type="button" data-acao="tela">Tela cheia <kbd>F</kbd></button>
      <button type="button" data-acao="reiniciar">Reiniciar</button>
    </nav>
  </footer>

  <div class="sobreposicao" id="conferencia" role="dialog" aria-modal="true" aria-labelledby="conferencia-titulo" hidden>
    <div class="caixa">
      <h2 id="conferencia-titulo">Conferir cartela</h2>
      <p class="dica">Digite o número da cartela com # (exemplo: #12) ou os números separados por espaço e aperte Enter. Esc fecha.</p>
      <input type="text" id="campo-conferencia" autocomplete="off" placeholder="exemplo: #12   ou   5 12 33 47 61">
      <p class="resultado" id="resultado-conferencia" role="status"></p>
      <div class="caixa-botoes">
        <button type="button" class="principal" id="botao-conferir">Conferir</button>
        <button type="button" id="botao-fechar">Fechar</button>
      </div>
    </div>
  </div>

  <script src="js/gerador-cartela.js"></script>
  <script src="js/sorteio.js"></script>
</body>
</html>
