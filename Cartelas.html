<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartelas de Bingo</title>
  <link rel="stylesheet" href="css/cartelas.css">
</head>
<body>
  <header class="controles">
    <a class="botao-secundario" href="index.html">← Ir para o sorteio</a>

    <label>Título da cartela
      <input type="text" id="titulo" value="Bingo da Confraternização">
    </label>

    <label>Primeira cartela nº
      <input type="number" id="primeira" value="1" min="1" max="9999">
    </label>

    <label>Quantidade
      <input type="number" id="quantidade" value="40" min="1" max="500">
    </label>

    <label>Por folha
      <select id="por-folha">
        <option value="2">2 cartelas (A4)</option>
        <option value="1">1 cartela grande (A4)</option>
      </select>
    </label>

    <button type="button" id="gerar">Gerar</button>
    <button type="button" class="botao-impressao" id="imprimir">Imprimir</button>

    <p class="aviso">Cada número de cartela gera sempre a mesma cartela, e a tela do sorteio reconhece essas cartelas pelo número: na conferência, digite #12 para checar a cartela nº 12. Imprima algumas a mais para reserva.</p>
  </header>

  <main id="folhas"></main>

  <script src="js/gerador-cartela.js"></script>
  <script src="js/cartelas.js"></script>
</body>
</html>
